# Smoke-Test für jeden Push auf main und jeden PR. Dependabot-PRs (Patch/Minor) werden danach
# automatisch gemergt; deployt wird vom Server selbst (sym: site-autodeploy, stündlich).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"   # wie auf sym
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: bin/smoke-test

  automerge:
    needs: test
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3
      - name: Merge (nicht bei Major)
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --squash --delete-branch "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
